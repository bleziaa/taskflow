<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evaluaciones | TaskFlow</title>
  <link rel="stylesheet" href="css/styles.css?v=20261106f">
  <link rel="stylesheet" href="css/theme.css"><link rel="stylesheet" href="css/practices.css"><link rel="stylesheet" href="css/evaluations.css">
  <link rel="stylesheet" href="css/organization-switcher.css">
  <link rel="stylesheet" href="css/student-polish.css">
<link rel="stylesheet" href="css/ui-compact.css?v=20261106i">
</head>
<body>
  <header class="header"><div class="header-container">
    <a class="logo" href="index.html"><span>TaskFlow</span></a>
    <button type="button" class="nav-toggle" aria-expanded="false" aria-controls="menu-principal" aria-label="Abrir menú de navegación"><span class="nav-toggle-bar"></span><span class="nav-toggle-bar"></span><span class="nav-toggle-bar"></span></button>
      <nav class="nav-main" id="menu-principal" aria-label="Navegación principal"><ul class="nav-lista"><li><a class="nav-link" href="dashboard.html">Inicio</a></li><li><a class="nav-link" href="courses.html">Mis cursos</a></li><li><a class="nav-link" href="practices.html">Mi práctica</a></li><li><a class="nav-link" href="activities.html">Actividades</a></li><li><a class="nav-link" href="evaluations.html" aria-current="page">Evaluaciones</a></li><li><a class="nav-link" href="reports.html">Mi progreso</a></li><li><a class="nav-link" id="admin-link" href="admin.html" hidden>Administración</a></li><li><span class="usuario-nombre" id="evaluation-user">Cargando…</span></li><li><button class="btn btn-secundario btn-sm" id="btn-logout" type="button">Cerrar sesión</button></li></ul></nav>
  </div></header>
  <main class="dashboard"><section class="panel bloque">
    <div class="panel-header"><div><h1>Evaluaciones y seguimiento</h1><p class="panel-sub">Consulta el rendimiento y registra la valoración de cada práctica.</p></div></div>
    <p id="evaluation-message" class="form-mensaje" role="status" aria-live="polite"></p>
    <section id="evaluation-form-wrap" hidden>
      <form id="evaluation-form" class="formulario evaluation-form">
        <h2 id="evaluation-form-title">Registrar evaluación</h2>
        <div class="campo"><label for="ev-practice">Práctica</label><select id="ev-practice" name="practica" required></select></div>
        <div class="evaluation-grid">
          <div class="campo"><label for="ev-score">Calificación (0 a 5)</label><input id="ev-score" name="calificacion" type="number" min="0" max="5" step="0.1" required></div>
          <div class="campo"><label for="ev-concept">Concepto</label><select id="ev-concept" name="concepto" required><option value="excelente">Excelente</option><option value="bueno">Bueno</option><option value="satisfactorio">Satisfactorio</option><option value="insuficiente">Insuficiente</option></select></div>
          <div class="campo"><label for="ev-strengths">Fortalezas</label><textarea id="ev-strengths" name="fortalezas" rows="3" maxlength="2000"></textarea></div>
          <div class="campo"><label for="ev-improve">Aspectos por mejorar</label><textarea id="ev-improve" name="aspectosMejora" rows="3" maxlength="2000"></textarea></div>
          <div class="campo evaluation-wide"><label for="ev-notes">Observaciones generales</label><textarea id="ev-notes" name="observaciones" rows="3" maxlength="3000"></textarea></div>
        </div>
        <div class="nav-acciones"><button class="btn btn-primario" type="submit">Guardar evaluación</button></div>
      </form>
    </section>
    <div id="evaluation-list" class="practice-list"><p>Cargando evaluaciones…</p></div>
  </section></main>
  <script src="js/evaluations.js" defer></script>
  <script src="js/ui.js" defer></script>
  <script src="js/theme.js" defer></script>
  <script src="js/organization-switcher.js" defer></script>
</body></html>
