<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Crea una nueva contraseña para tu cuenta TaskFlow.">
  <title>Restablecer contraseña — TaskFlow</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='28' fill='%236841b8'/%3E%3Cpath d='M30 52 L43 65 L70 35' fill='none' stroke='white' stroke-width='10' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    try {
      const saved = localStorage.getItem('taskflow-theme');
      document.documentElement.dataset.theme = saved === 'dark' || saved === 'light' ? saved : 'light';
    } catch (_) { document.documentElement.dataset.theme = 'light'; }
  </script>
  <link rel="stylesheet" href="css/styles.css?v=20261106f">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/ui-compact.css?v=20261106j">
</head>
<body>
  <a class="skip-link" href="#contenido">Saltar al contenido</a>
  <header class="header">
    <div class="header-container">
      <a href="login.html" class="logo"><span class="logo-icon"><img src="assets/icon.png" alt=""></span><span>TaskFlow</span></a>
      <a href="login.html" class="btn btn-secundario btn-sm">← Volver al acceso</a>
    </div>
  </header>
  <main class="auth-page" id="contenido">
    <section class="auth-card">
      <span class="badge-accent">Seguridad de tu cuenta</span>
      <h1>Crear nueva contraseña</h1>
      <p class="auth-sub">Elige una contraseña segura de al menos 12 caracteres.</p>
      <form id="form-restablecer" class="formulario" novalidate>
        <div class="campo">
          <label for="new-password">Nueva contraseña</label>
          <input type="password" id="new-password" autocomplete="new-password" minlength="12" maxlength="128" required>
        </div>
        <div class="campo">
          <label for="confirm-password">Confirmar contraseña</label>
          <input type="password" id="confirm-password" autocomplete="new-password" minlength="12" maxlength="128" required>
        </div>
        <p class="form-mensaje" id="mensaje-restablecer" role="status" aria-live="polite"></p>
        <button type="submit" class="btn btn-primario btn-bloque">Guardar nueva contraseña</button>
      </form>
      <p class="auth-enlace"><a href="login.html">Volver a iniciar sesión</a></p>
    </section>
  </main>
  <script src="js/password-reset.js" defer></script>
  <script src="js/theme.js" defer></script>
</body>
</html>
