<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#201c2b"><title>Cambiar contraseña | TaskFlow</title>
  <link rel="stylesheet" href="css/styles.css"><link rel="stylesheet" href="css/theme.css"><link rel="stylesheet" href="css/admin.css">
</head>
<body>
<main class="admin-page" style="max-width:620px;margin:8vh auto">
  <section class="admin-surface">
    <span class="admin-eyebrow">Seguridad de la cuenta</span>
    <h1>Actualiza tu contraseña</h1>
    <p>Esta cuenta tiene una contraseña temporal. Antes de continuar, crea una contraseña personal de al menos 12 caracteres.</p>
    <form id="form-cambiar-password" class="admin-form-grid">
      <label>Nueva contraseña<input type="password" name="newPassword" minlength="12" maxlength="128" autocomplete="new-password" required></label>
      <label>Confirma la nueva contraseña<input type="password" name="confirmPassword" minlength="12" maxlength="128" autocomplete="new-password" required></label>
      <div class="admin-form-actions"><button class="btn btn-primario" type="submit">Guardar contraseña y continuar</button></div>
      <p id="password-mensaje" class="form-mensaje" role="status" aria-live="polite"></p>
    </form>
  </section>
</main>
<script src="js/cambiar-password.js" defer></script>
</body></html>
